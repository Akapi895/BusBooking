# HTTPS at the frontend Nginx. Put the certificate chain and key in ./certs first:
#   deploy/certs/fullchain.pem, deploy/certs/privkey.pem (e.g. from Let's Encrypt for your domain)
#   docker compose -f compose.yaml -f deploy/compose.tls.yaml up -d
# Port 80 only redirects to 443; HSTS is sent on HTTPS responses.
services:
  frontend:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/nginx-app.conf:/etc/nginx/snippets/busbooking.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

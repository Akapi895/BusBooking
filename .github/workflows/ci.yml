name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: busbooking_test
          POSTGRES_USER: busbooking_test
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U busbooking_test -d busbooking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/busbooking_test
      TEST_DB_USERNAME: busbooking_test
      TEST_DB_PASSWORD: ci-postgres-only
      TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --check frontend/app.js

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Catches a broken Dockerfile or compose file that the Maven tests would not.
      - run: docker build -t busbooking:ci .
      - run: docker compose -f compose.yaml -f compose.scale.yaml -f compose.tls.yaml --profile metrics config --quiet
        env:
          DB_PASSWORD: ci
          JWT_SECRET: ci
          EMAIL_OTP_SECRET: ci
          OTP_OUTBOX_SECRET: ci

  load-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: load-tests/requirements-kaggle.txt
      - run: python -m pip install -r load-tests/requirements-kaggle.txt
      - run: python -B -m unittest discover -s load-tests/tests -v

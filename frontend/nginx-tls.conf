# Used by compose.tls.yaml. Certificate files are mounted from ./certs (see docs/06-running-guide.md).

# Explicit port in the browser's Host (e.g. :8443); empty means the scheme default, 443.
map $http_host $tls_host_port {
    "~:(?<port>[0-9]+)$" $port;
    default "";
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # The backend sees https and the browser's port, so Origin https://host matches.
    set $forwarded_proto https;
    set $forwarded_port $tls_host_port;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/busbooking.conf;
}

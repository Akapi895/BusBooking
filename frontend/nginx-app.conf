# Shared by nginx.conf (HTTP) and nginx-tls.conf (HTTPS); included inside a server block.
root /usr/share/nginx/html;
index index.html;
server_tokens off;

# Server-level headers: inherited by every location below that sets no add_header of its own.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Same origin as the UI, so the backend needs no CORS config.
# $http_host keeps the port: Spring compares it with the Origin header.
location /api/ {
    proxy_pass http://backend:8085;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Set by the including server block. Empty (HTTP) means not sent, so Tomcat keeps the Host port;
    # sending "http" would reset the port to 80 and fail Spring's same-origin check against Origin.
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
}

# The config files sit in the served folder; do not hand them out.
location ~ ^/(nginx.*\.conf|README\.md)$ {
    return 404;
}

location / {
    try_files $uri /index.html;
}

# Local stack: PostgreSQL, backend, frontend Nginx (http://localhost:5173), Mailpit.
#   docker compose up -d --build
# Prometheus (http://127.0.0.1:9090) + Grafana (http://127.0.0.1:3000, dashboard "BusBooking"):
#   docker compose --profile metrics up -d
# Several backends with a shared Redis rate limit: compose.scale.yaml. HTTPS: compose.tls.yaml.

# Fixed project name: volumes and networks are busbooking_*, whichever clone folder runs Compose.
name: busbooking

services:
  postgres:
    image: postgres:16
    container_name: busbooking-db
    restart: unless-stopped
    # Lock waits longer than deadlock_timeout (1 s) are written to the server log.
    command: ["postgres", "-c", "log_lock_waits=on"]

    environment:
      POSTGRES_DB: busbooking_dev_fresh
      POSTGRES_USER: busbooking_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_required}

    ports:
      # Host loopback only: the database must not be reachable from the network.
      - "127.0.0.1:5435:5432"

    volumes:
      - busbooking_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busbooking_user -d busbooking_dev_fresh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: busbooking-backend
    restart: unless-stopped

    ports:
      # Direct API access for local tools only; clients go through Nginx on port 5173.
      - "127.0.0.1:8086:8085"
      # Actuator (health, metrics incl. hikaricp.*) published to the host's loopback only.
      - "127.0.0.1:8087:8081"

    environment:
      # dev seeds demo accounts (known password) and enables Swagger; set SPRING_PROFILES_ACTIVE=prod on a shared server.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      DB_URL: jdbc:postgresql://postgres:5432/busbooking_dev_fresh
      DB_USERNAME: busbooking_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_required}
      EMAIL_OTP_SECRET: ${EMAIL_OTP_SECRET:?EMAIL_OTP_SECRET_required}
      OTP_OUTBOX_SECRET: ${OTP_OUTBOX_SECRET:?OTP_OUTBOX_SECRET_required}

      # Defaults deliver to Mailpit; set the SMTP_* values in .env for a real mail provider.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@busbooking.local}

      BOOTSTRAP_SUPER_ADMIN_ENABLED: "false"

      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
      SERVER_FORWARD_HEADERS_STRATEGY: native
      MANAGEMENT_ADDRESS: 0.0.0.0
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: "172[.]31[.]241[.]2"

    networks:
      default:
      proxy:

    # The runtime image has no curl/wget; bash's /dev/tcp asks Actuator directly.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: nginx:1.27-alpine
    container_name: busbooking-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/nginx-app.conf:/etc/nginx/snippets/busbooking.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.31.241.2

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: busbooking-mailpit
    restart: unless-stopped

    ports:
      # Loopback only: the inbox shows every OTP and password reset code.
      - "127.0.0.1:8026:8025"

  # ---------- Metrics, only with --profile metrics ----------
  prometheus:
    profiles: [metrics]
    image: prom/prometheus:v2.54.1
    container_name: busbooking-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - postgres-exporter

  postgres-exporter:
    profiles: [metrics]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: busbooking-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/busbooking_dev_fresh?sslmode=disable
      DATA_SOURCE_USER: busbooking_user
      DATA_SOURCE_PASS: ${DB_PASSWORD:?DB_PASSWORD_required}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./observability/postgres-exporter-queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    profiles: [metrics]
    image: grafana/grafana:11.2.0
    container_name: busbooking-grafana
    environment:
      # Local-only dashboard (bound to loopback): open it without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/busbooking.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  busbooking_data:
  prometheus_data:
  grafana_data:

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.31.241.0/28
          ip_range: 172.31.241.8/29

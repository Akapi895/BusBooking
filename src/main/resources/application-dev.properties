# Local Mailpit only. Production uses authenticated SMTP with STARTTLS by default.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# Dev-only demo data (accounts, catalogue, trips, bookings); see db/seed/R__dev_seed_data.sql.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
